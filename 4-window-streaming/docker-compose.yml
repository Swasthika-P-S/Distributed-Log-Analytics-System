# version: "3.8" - obsolete

# ═══════════════════════════════════════════════════════════════════════
#  4-window-streaming  –  Window-based Stream Processing Algorithm
#
#  Services
#  ────────
#  zookeeper      – Kafka co-ordinator
#  kafka          – Message broker  (topic: window-logs)
#  kafka-init     – One-shot job that creates the topic
#  window-producer – Emits 1 structured JSON log/second to Kafka
#  spark-streaming – PySpark Structured Streaming job:
#                    • Tumbling window (1 min, non-overlapping)
#                    • Sliding window  (2 min / 30 sec slide)
#                    • Real-time ERROR alerts
# ═══════════════════════════════════════════════════════════════════════

services:

  # ── Zookeeper ────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zk-window
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka Broker ─────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-window
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Keep data only for 1 hour – fine for demos
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 8

  # ── Topic initializer (one-shot) ─────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-window-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo 'Creating topic window-logs ...'
        kafka-topics --create \
          --bootstrap-server kafka:29092 \
          --topic window-logs \
          --partitions 3 \
          --replication-factor 1 \
          --if-not-exists
        echo 'Topic ready.'
    restart: "no"

  # ── Log Producer ─────────────────────────────────────────────────────
  window-producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: window-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
    restart: on-failure

  # ── Spark Structured Streaming ────────────────────────────────────────
  spark-streaming:
    build:
      context: ./spark-streaming
      dockerfile: Dockerfile
    container_name: spark-window-streaming
    depends_on:
      kafka:
        condition: service_healthy
      window-producer:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: window-logs
    volumes:
      - /tmp/spark-checkpoints:/tmp/checkpoints # persist checkpoints
    restart: on-failure
