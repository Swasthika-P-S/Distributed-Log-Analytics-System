services:
  # -----------------------------------------------------------
  # ZOOKEEPER – Cluster coordination
  # -----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # BROKER 1 – Port 9092
  # -----------------------------------------------------------
  broker-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker-1
    hostname: broker-1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:29092,EXTERNAL://10.12.75.131:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker-1:29092" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------
  # BROKER 2 – Port 9093
  # -----------------------------------------------------------
  broker-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker-2
    hostname: broker-2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:29093,EXTERNAL://10.12.75.131:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
    volumes:
      - broker-2-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker-2:29093" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------
  # BROKER 3 – Port 9094
  # -----------------------------------------------------------
  broker-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker-3
    hostname: broker-3
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:29094,EXTERNAL://10.12.75.131:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
    volumes:
      - broker-3-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker-3:29094" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # Log Producer
  producer:
    build: ./producer
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER: broker-1:29092,broker-2:29093,broker-3:29094

  # Log Consumer
  consumer:
    build: ./consumer
    depends_on:
      broker-1:
        condition: service_healthy
    volumes:
      - ./storage/logs:/app/logs
    environment:
      KAFKA_BROKER: broker-1:29092,broker-2:29093,broker-3:29094

  # --- HDFS Cluster ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - ENSURE_NAMENODE_DIR=/hadoop/dfs/name
    env_file:
      - ./hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: unless-stopped
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    volumes:
      - datanode1_data:/hadoop/dfs/data

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    restart: unless-stopped
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    volumes:
      - datanode2_data:/hadoop/dfs/data

  # --- Spark Log Processor ---
  spark:
    image: apache/spark:3.5.0
    container_name: spark-processor
    depends_on:
      broker-1:
        condition: service_healthy
      namenode:
        condition: service_started
    volumes:
      - ./spark:/app
      - ./storage/logs:/logs
    environment:
      - SPARK_MODE=master
      - KAFKA_BROKER=broker-1:29092,broker-2:29093,broker-3:29094
      - HDFS_URI=hdfs://namenode:9000/logs/processed/
      - CHECKPOINT_LOCATION=hdfs://namenode:9000/spark-checkpoints
      - ALERT_THRESHOLD=100
    ports:
      - "8080:8080"
      - "7077:7077"

volumes:
  zookeeper-data:
  zookeeper-log:
  broker-1-data:
  broker-2-data:
  broker-3-data:
  namenode_data:
  datanode1_data:
  datanode2_data:


networks:
  default:
    name: kafka-cluster-net
