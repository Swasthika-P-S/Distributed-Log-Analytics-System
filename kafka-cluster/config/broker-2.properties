########################
# Broker 2 Configuration
########################

# Broker identity
broker.id=2

# Zookeeper connection
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

# Listeners
listeners=INTERNAL://broker-2:29093,EXTERNAL://10.12.75.131:9093
advertised.listeners=INTERNAL://broker-2:29093,EXTERNAL://10.12.75.131:9093
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL

# Log (data) directories
log.dirs=/var/lib/kafka/data

# Partition & replication defaults
num.partitions=3
default.replication.factor=2
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
min.insync.replicas=1

# Log retention
log.retention.hours=24
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
log.cleanup.policy=delete

# Auto-create topics disabled
auto.create.topics.enable=false

# Threading
num.network.threads=3
num.io.threads=8
num.recovery.threads.per.data.dir=1

# Socket settings
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Group coordinator rebalance
group.initial.rebalance.delay.ms=0
